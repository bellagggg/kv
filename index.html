<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>kv的表單</title>
<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<style>
:root{--bg:#f8f7fa;--card:#fff;--ink:#292631;--muted:#77717f;--line:#e8e2ee;--main:#6d5a8d;--soft:#f0ebf6;--danger:#c94e5b;--ok:#4f8a68}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang TC","Microsoft JhengHei",sans-serif;padding-bottom:84px}button,input,select,textarea{font:inherit}button{cursor:pointer}.loading{text-align:center;padding:70px 18px;color:var(--muted)}header{height:180px;background:url('./7C608754-2BEA-4C40-89CE-190A9721D7E6.jpeg') center/cover no-repeat}.toolbar{padding:14px 16px 4px;position:sticky;top:0;background:rgba(248,247,250,.96);z-index:2}.categories{display:flex;gap:7px;overflow:auto;padding:10px 0 5px}.chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:7px 13px;white-space:nowrap;font-size:12px}.chip.active{background:var(--main);border-color:var(--main);color:#fff}.result-count{font-size:12px;color:var(--muted);padding:3px 1px 5px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:10px 16px}.card{background:#fff;border-radius:12px;overflow:hidden;border:1px solid #eee;box-shadow:0 2px 8px rgba(50,40,70,.05)}.card img,.noimg{width:100%;aspect-ratio:1;object-fit:cover;background:var(--soft);display:block}.noimg{display:flex;align-items:center;justify-content:center;color:#aaa;font-size:12px}.info{padding:10px;display:flex;flex-direction:column;min-height:100px}.name{font-size:13px;font-weight:700;line-height:1.45}.price{font-size:14px;font-weight:800;color:var(--main);margin-top:7px}.stock{font-size:11px;margin-top:5px;color:var(--muted)}.stock.out{color:var(--danger)}.desc{font-size:12px;color:var(--muted);line-height:1.55;white-space:pre-wrap;margin:8px 0}.cartbar{position:fixed;bottom:0;left:0;right:0;background:var(--main);color:#fff;padding:11px 15px calc(11px + env(safe-area-inset-bottom));display:flex;justify-content:space-between;align-items:center;z-index:20;box-shadow:0 -3px 12px rgba(0,0,0,.12)}.cartbar button{border:0;border-radius:9px;padding:9px 15px;color:var(--main);background:#fff;font-weight:800}.actions{display:flex;gap:8px;padding:10px 16px}.outline{flex:1;background:#fff;border:1px solid var(--line);color:var(--main);border-radius:10px;padding:11px;font-weight:700}.overlay{display:none;position:fixed;inset:0;background:rgba(30,20,40,.45);z-index:30}.overlay.show{display:block}.sheet{position:fixed;left:0;right:0;bottom:0;background:#fff;border-radius:18px 18px 0 0;max-height:90vh;overflow:auto;z-index:31;padding:16px 16px 28px;transform:translateY(105%);transition:.22s}.sheet.show{transform:translateY(0)}.title{font-weight:800;font-size:17px;display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}.close{color:#999;font-size:20px}.btn{width:100%;border:0;border-radius:10px;background:var(--main);color:#fff;padding:13px;font-weight:800;margin-top:10px}.btn:disabled{opacity:.5}.secondary{background:var(--soft);color:var(--main)}.danger{background:#fff0f1;color:var(--danger);border:1px solid #f2cdd1}.cartitem{display:flex;gap:9px;align-items:center;border:1px solid var(--line);border-radius:10px;padding:9px;margin-bottom:8px}.thumb{width:52px;height:52px;border-radius:7px;object-fit:cover;background:var(--soft);flex-shrink:0}.detail{flex:1;min-width:0}.small{font-size:12px;color:var(--muted);line-height:1.5}.qty{display:flex;align-items:center;gap:5px}.qty button{width:25px;height:25px;border:1px solid var(--line);border-radius:7px;background:#fff;color:var(--main)}.total{display:flex;justify-content:space-between;border-top:1px solid var(--line);padding:12px 3px;font-weight:800}.product-img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:12px;background:var(--soft)}.option-title{font-weight:700;font-size:14px;margin:14px 0 8px}.options{display:flex;flex-wrap:wrap;gap:8px}.option{padding:8px 13px;border:1px solid var(--line);background:#fff;border-radius:999px;font-size:13px}.option.sel{background:var(--main);color:#fff;border-color:var(--main)}.detail-qty-row{display:flex;align-items:center;gap:10px}.detail-qty-row button{width:32px;height:32px;border:1px solid var(--line);border-radius:8px;background:#fff}.field{margin:12px 0}.field label{display:block;font-weight:700;font-size:13px;margin-bottom:6px}.req{color:var(--danger)}.field input,.field select,.field textarea{width:100%;padding:11px;border:1px solid var(--line);border-radius:9px;background:#fff;outline:none}.field textarea{min-height:72px;resize:vertical}.payment{background:var(--soft);border-radius:10px;padding:12px;line-height:1.7;font-size:13px}.summary{background:#faf8fc;border:1px solid var(--line);border-radius:10px;padding:11px;margin-bottom:12px}.summary-row{display:flex;justify-content:space-between;gap:10px;font-size:13px;margin:5px 0}.summary-items{border-bottom:1px dashed var(--line);padding-bottom:7px;margin-bottom:7px}.order{border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:10px}.order-head{display:flex;justify-content:space-between;gap:8px;font-weight:800}.badge{padding:4px 8px;border-radius:999px;background:var(--soft);color:var(--main);font-size:11px}.order-item{font-size:12px;margin-top:7px}.success{text-align:center;padding:25px 8px}.success .icon{font-size:48px}.empty{text-align:center;color:#aaa;padding:30px 10px;font-size:13px}.error{color:var(--danger);font-size:13px;margin-top:9px}.ok{color:var(--ok);font-size:13px;margin-top:9px}.hidden{display:none!important}
@media(min-width:700px){.grid{grid-template-columns:repeat(4,1fr);max-width:1000px;margin:auto}.toolbar{max-width:1000px;margin-left:auto;margin-right:auto}}
</style>
</head>
<body>
<div id="loading" class="loading">正在載入網站…</div>
<main id="shop" class="hidden">
<header></header>
<div class="toolbar">
<div class="actions" style="padding:0 0 4px;flex-wrap:wrap">
<button class="outline" id="ordersBtn">📦 我的訂單</button>
<button class="outline" id="contactBtn2">💬 聯絡賣家</button>
<button class="outline" id="pickupBtn" style="flex-basis:100%;margin-top:8px">📦 代收登記</button>
</div>
<div id="cats" class="categories"></div>
<div id="count" class="result-count"></div>
</div>
<div id="grid" class="grid"></div>
</main>
<div id="cartbar" class="cartbar hidden"><span id="cartcount">購物車：0 件</span><button id="cartbtn">查看購物車</button></div>
<div id="overlay" class="overlay"></div>
<div id="productSheet" class="sheet"><div class="title">商品資訊<span class="close" data-close>✕</span></div><div id="productContent"></div></div>
<div id="cartSheet" class="sheet"><div class="title">購物車<span class="close" data-close>✕</span></div><div id="cartItems"></div><div class="total"><span>合計</span><span id="cartTotal">NT$0</span></div><div class="small">二補明細會在社群更新，進度表在記事本。</div><button class="btn" id="checkoutBtn">前往結帳</button></div>
<div id="checkoutSheet" class="sheet"><div class="title">確認訂單與填寫資料<span class="close" data-close>✕</span></div><div id="checkoutSummary" class="summary"></div><div id="paymentBox" class="payment hidden"></div><form id="form"><div id="fields"></div><button class="btn" id="submit" type="submit">確認送出訂單</button><div id="formMsg"></div></form></div>
<div id="successSheet" class="sheet"><div class="success"><div class="icon">✅</div><h2>訂單已成立</h2><div id="successContent"></div><button class="btn" id="successOrders">查看我的訂單</button><button class="btn secondary" data-close>回到商品</button></div></div>
<div id="ordersSheet" class="sheet"><div class="title">我的訂單<span class="close" data-close>✕</span></div><div id="orders"></div></div>
<div id="editSheet" class="sheet"><div class="title">修改訂單資料<span class="close" data-close>✕</span></div><div class="small">若要更換商品，請先取消可取消的訂單後重新下單。</div><div id="editFields"></div><button class="btn" id="saveEdit">儲存修改</button><div id="editMsg"></div></div>
<div id="pickupSheet" class="sheet"><div class="title">代收登記<span class="close" data-close>✕</span></div><div class="small">出貨國家為必填；商品名稱與托運單號末四碼至少填寫其中一項。之後可以回來補上缺少的資料。</div><div id="pickupList" style="margin-top:10px"></div><div class="option-title">新增一筆代收登記</div><div class="field"><label>出貨國家 <span class="req">*</span></label><input id="pkCountry" required placeholder="例如：韓國、日本、美國"></div><div class="field"><label>商品名稱</label><input id="pkName" placeholder="例如：SWIM外套"></div><div class="field"><label>托運單號末四碼</label><input id="pkTrack" maxlength="4" inputmode="text" placeholder="例如：8421"></div><button class="btn" id="pkSubmit">送出登記</button><div id="pkMsg"></div></div>
<script>
const API_URL='https://script.google.com/macros/s/AKfycbzlzcgRUzmx2fLKrdhlhOvHh55PiuQ2cjnKnAfnnlAMUJ3vHseoDzWJjID-GRFZf0trhg/exec';
const LIFF_ID='2011023306-dup0EKv1';
const CART_KEY='kv_cart_v5';
let userId='',displayName='',products=[],fields=[],paymentInfo=[],contactUrl='',cart={},category='',editingOrder=null,ordersCache=[],pickupsCache=[];
const $=id=>document.getElementById(id);
const money=n=>'NT$'+Number(n||0).toLocaleString('zh-TW');

function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function showError(msg){$('loading').innerHTML='<div class="error">'+esc(msg)+'</div><button class="btn" style="max-width:360px" onclick="location.reload()">重新載入</button>'}
function withTimeout(promise,ms,label){return Promise.race([promise,new Promise((_,reject)=>setTimeout(()=>reject(new Error(label+'逾時，請檢查網路或後端設定。')),ms))])}

async function apiGet(params={}){
const q=new URLSearchParams(params);
const r=await withTimeout(fetch(API_URL+'?'+q.toString(),{method:'GET',cache:'no-store'}),15000,'網站資料讀取');
if(!r.ok)throw new Error('後端回應 HTTP '+r.status);
const text=await r.text();
try{return JSON.parse(text)}catch(e){throw new Error('後端沒有回傳有效 JSON。請檢查 Apps Script Web App 是否仍可存取。')}
}
async function apiPost(body){
const r=await withTimeout(fetch(API_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(body)}),20000,'送出資料');
if(!r.ok)throw new Error('後端回應 HTTP '+r.status);
const text=await r.text();
try{return JSON.parse(text)}catch(e){throw new Error('後端沒有回傳有效 JSON。')}
}

function saveCart(){localStorage.setItem(CART_KEY,JSON.stringify(cart))}
function loadCart(){try{cart=JSON.parse(localStorage.getItem(CART_KEY)||'{}')||{}}catch(e){cart={}}}
function totalQty(){return Object.values(cart).reduce((s,i)=>s+Number(i.qty||0),0)}
function totalMoney(){return Object.values(cart).reduce((s,i)=>s+Number(i.price||0)*Number(i.qty||0),0)}
function updateCart(){saveCart();const q=totalQty();$('cartbar').classList.toggle('hidden',q===0);$('cartcount').textContent='購物車：'+q+' 件 · '+money(totalMoney())}
function openSheet(id){const el=$(id);if(!el)return;document.querySelectorAll('.sheet').forEach(x=>x.classList.remove('show'));$('overlay').classList.add('show');el.classList.add('show')}
function closeAll(){document.querySelectorAll('.sheet').forEach(x=>x.classList.remove('show'));$('overlay').classList.remove('show')}
$('overlay').onclick=closeAll;
document.querySelectorAll('[data-close]').forEach(x=>x.onclick=closeAll);

function normalizeProduct(p){
return Object.assign({id:'',name:'',price:0,image:'',description:'',category:'',status:'上架',stock:null,limit:null,optionName:'',optionValues:[]},p||{}, {optionValues:Array.isArray(p?.optionValues)?p.optionValues:[]});
}
function renderCategories(){
const cats=[...new Set(products.map(p=>String(p.category||'').trim()).filter(c=>c&&c!=='其他'))];
$('cats').innerHTML='';
if(category&&!cats.includes(category))category='';
cats.forEach(c=>{const b=document.createElement('button');b.type='button';b.className='chip '+(c===category?'active':'');b.textContent=c;b.onclick=()=>{category=c;renderCategories();renderProducts()};$('cats').appendChild(b)})
}
function renderProducts(){
const list=products.filter(p=>!category||String(p.category||'')===category);
$('count').textContent='共 '+list.length+' 項商品';
$('grid').innerHTML='';
if(!list.length){$('grid').innerHTML='<div class="empty" style="grid-column:1/-1">目前沒有商品</div>';return}
list.forEach(p=>{
const card=document.createElement('article');card.className='card';card.onclick=()=>openProduct(p);
const img=p.image?Object.assign(document.createElement('img'),{src:p.image,alt:p.name}):Object.assign(document.createElement('div'),{className:'noimg',textContent:'無圖片'});card.appendChild(img);
const info=document.createElement('div');info.className='info';info.innerHTML='<div class="name">'+esc(p.name)+'</div><div class="price">'+money(p.price)+'</div>';
const st=document.createElement('div');st.className='stock';
if(p.status!=='上架'){st.className+=' out';st.textContent='目前暫停販售'}else if(Number(p.stock)===0){st.className+=' out';st.textContent='已售罄'}else if(p.stock!==null&&p.stock!==undefined&&p.stock!==''){st.textContent='剩餘 '+p.stock+' 件'}else{st.textContent='可購買'}
info.appendChild(st);card.appendChild(info);$('grid').appendChild(card)
})
}

function openProduct(p){
let selected=p.optionValues.length?'':null,qty=1;const c=$('productContent');c.innerHTML='';
const img=p.image?Object.assign(document.createElement('img'),{className:'product-img',src:p.image,alt:p.name}):Object.assign(document.createElement('div'),{className:'noimg',textContent:'無圖片'});c.appendChild(img);
const n=document.createElement('h2');n.textContent=p.name;c.appendChild(n);
const pr=document.createElement('div');pr.className='price';pr.style.fontSize='19px';pr.textContent=money(p.price);c.appendChild(pr);
if(p.description){const d=document.createElement('div');d.className='desc';d.textContent=p.description;c.appendChild(d)}
if(p.optionValues.length){const t=document.createElement('div');t.className='option-title';t.textContent='請選擇'+(p.optionName?' '+p.optionName:'規格');c.appendChild(t);const os=document.createElement('div');os.className='options';p.optionValues.forEach(v=>{const b=document.createElement('button');b.type='button';b.className='option';b.textContent=v;b.onclick=()=>{selected=v;os.querySelectorAll('.option').forEach(x=>x.classList.remove('sel'));b.classList.add('sel')};os.appendChild(b)});c.appendChild(os)}
const qrow=document.createElement('div');qrow.className='detail-qty-row';qrow.style.marginTop='15px';qrow.innerHTML='<strong>數量</strong>';const minus=document.createElement('button');minus.type='button';minus.textContent='−';const qs=document.createElement('span');qs.textContent='1';const plus=document.createElement('button');plus.type='button';plus.textContent='+';
minus.onclick=()=>{if(qty>1){qty--;qs.textContent=qty}};plus.onclick=()=>{let max=p.stock===null||p.stock===undefined||p.stock===''?Infinity:Number(p.stock);if(p.limit!==null&&p.limit!==undefined&&p.limit!=='')max=Math.min(max,Number(p.limit));if(qty<max){qty++;qs.textContent=qty}};qrow.append(minus,qs,plus);c.appendChild(qrow);
const add=document.createElement('button');add.className='btn';add.textContent=p.status!=='上架'||Number(p.stock)===0?'目前無法購買':'加入購物車';add.disabled=p.status!=='上架'||Number(p.stock)===0;add.onclick=()=>{if(p.optionValues.length&&!selected){alert('請先選擇規格');return}addToCart(p,selected||'',qty);closeAll()};c.appendChild(add);openSheet('productSheet')
}
function addToCart(p,option,qty){const key=p.id+'__'+option;if(!cart[key])cart[key]={productId:p.id,name:p.name,option,price:Number(p.price)||0,image:p.image||'',qty:0};cart[key].qty+=qty;saveCart();updateCart()}

function renderCart(){
const box=$('cartItems');box.innerHTML='';const es=Object.entries(cart);if(!es.length){box.innerHTML='<div class="empty">購物車是空的</div>';$('cartTotal').textContent=money(0);return}
es.forEach(([key,i])=>{const row=document.createElement('div');row.className='cartitem';const im=i.image?Object.assign(document.createElement('img'),{className:'thumb',src:i.image,alt:i.name}):Object.assign(document.createElement('div'),{className:'thumb',textContent:'無圖'});row.appendChild(im);const d=document.createElement('div');d.className='detail';d.innerHTML='<div><strong>'+esc(i.name)+'</strong>'+(i.option?' <span class="small">('+esc(i.option)+')</span>':'')+'</div><div class="small">'+money(i.price)+' / 件</div>';row.appendChild(d);const q=document.createElement('div');q.className='qty';const m=document.createElement('button');m.type='button';m.textContent='−';const s=document.createElement('span');s.textContent=i.qty;const p=document.createElement('button');p.type='button';p.textContent='+';m.onclick=()=>{i.qty--;if(i.qty<=0)delete cart[key];renderCart();updateCart()};p.onclick=()=>{const product=products.find(x=>x.id===i.productId);let max=product?(product.stock===null||product.stock===undefined||product.stock===''?Infinity:Number(product.stock)):Infinity;if(product&&product.limit!==null&&product.limit!==undefined&&product.limit!=='')max=Math.min(max,Number(product.limit));if(i.qty<max){i.qty++;renderCart();updateCart()}};q.append(m,s,p);row.appendChild(q);box.appendChild(row)});$('cartTotal').textContent=money(totalMoney())
}
function renderSummary(target){target.innerHTML='<div class="summary-items">'+Object.values(cart).map(i=>'<div class="summary-row"><span>'+esc(i.name)+(i.option?'（'+esc(i.option)+'）':'')+' × '+i.qty+'</span><b>'+money(i.price*i.qty)+'</b></div>').join('')+'</div><div class="summary-row"><span>商品合計</span><b>'+money(totalMoney())+'</b></div><div class="small">運費及其他補款依社群公告處理。</div>'}

function renderFields(){
const box=$('fields');box.innerHTML='';
fields.forEach((f,idx)=>{const w=document.createElement('div');w.className='field';const l=document.createElement('label');l.textContent=f.label||'';if(f.required){const r=document.createElement('span');r.className='req';r.textContent=' *';l.appendChild(r)}w.appendChild(l);let el;if(f.type==='下拉選單'){el=document.createElement('select');el.innerHTML='<option value="">請選擇</option>'+(f.options||[]).map(o=>'<option value="'+esc(o)+'">'+esc(o)+'</option>').join('')}else if(f.type==='多行文字'){el=document.createElement('textarea')}else{el=document.createElement('input');el.type={'電話':'tel','數字':'number','日期':'date'}[f.type]||'text'}el.id='f'+idx;w.appendChild(el);box.appendChild(w)})
const s=paymentInfo.map(x=>'<div><b>'+esc(x.label)+'：</b>'+esc(x.value)+'</div>').join('');$('paymentBox').innerHTML=s||'尚未提供匯款資訊。';$('paymentBox').classList.toggle('hidden',!s)
}
function collectValues(){const v={};let ok=true;fields.forEach((f,i)=>{const el=$('f'+i);v[f.label]=el?el.value.trim():'';if(f.required&&!v[f.label])ok=false});return {v,ok}}

function renderOrders(list){const box=$('orders');box.innerHTML='';if(!list.length){box.innerHTML='<div class="empty">目前沒有訂單。</div>';return}list.forEach(o=>{const d=document.createElement('div');d.className='order';d.innerHTML='<div class="order-head"><span>'+esc(o.orderId)+'</span><span class="badge">'+esc(o.status)+'</span></div><div class="small">付款：'+esc(o.paymentStatus||'未設定')+'</div>'+((o.items||[]).map(i=>'<div class="order-item">'+esc(i.name)+(i.option?'（'+esc(i.option)+'）':'')+' × '+i.qty+'　'+money(i.subtotal)+'</div>').join(''))+'<div class="total"><span>目前總額</span><span>'+money(o.total)+'</span></div>'+(o.canCancel?'<button class="btn danger" data-cancel="'+esc(o.orderId)+'">取消訂單</button><button class="btn secondary" data-edit="'+esc(o.orderId)+'">修改聯絡資料</button>':'');box.appendChild(d)});box.querySelectorAll('[data-cancel]').forEach(b=>b.onclick=()=>cancelOrder(b.dataset.cancel));box.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>editOrder(b.dataset.edit,list))}
function renderPickups(list){const box=$('pickupList');box.innerHTML='';if(!list.length){box.innerHTML='<div class="empty">目前還沒有代收登記紀錄。</div>';return}list.forEach(p=>{const d=document.createElement('div');d.className='order';const badgeColor=p.status==='已完整'?'style="color:var(--ok)"':'style="color:var(--danger)"';let html='<div class="order-head"><span>'+(p.name?esc(p.name):'<span class="small">（尚未填寫商品名稱）</span>')+'</span><span class="badge" '+badgeColor+'>'+esc(p.status)+'</span></div>';html+='<div class="small">出貨國家：'+(p.country||p.shippingCountry?esc(p.country||p.shippingCountry):'尚未填寫')+'</div>';html+='<div class="small">托運單號末四碼：'+(p.trackingLast4?esc(p.trackingLast4):'尚未填寫')+'</div>';d.innerHTML=html;if(p.status!=='已完整'){const fillRow=document.createElement('div');fillRow.style.marginTop='8px';fillRow.style.display='flex';fillRow.style.gap='6px';const inp=document.createElement('input');inp.placeholder=p.name?'補上托運單號末四碼':'補上商品名稱或托運單號末四碼';inp.maxLength=p.name?4:30;fillRow.appendChild(inp);const btn=document.createElement('button');btn.className='btn';btn.style.marginTop='0';btn.style.flexShrink='0';btn.style.width='auto';btn.textContent='補上';btn.onclick=()=>{const val=inp.value.trim();if(!val)return;const payload={recordId:p.recordId};if(!p.name){if(p.trackingLast4)payload.name=val;else if(/^[0-9A-Za-z]{4}$/.test(val))payload.trackingLast4=val;else payload.name=val}else payload.trackingLast4=val;submitPickup(payload)};fillRow.appendChild(btn);d.appendChild(fillRow)}box.appendChild(d)})}

async function loadPickups(){if(!userId){alert('尚未取得 LINE 使用者資料，請從 LINE 重新開啟此頁面。');return}$('pickupList').innerHTML='<div class="loading">讀取中…</div>';openSheet('pickupSheet');try{const r=await apiGet({action:'myPickups',userId});if(!r.success)throw Error(r.error||'讀取代收資料失敗');pickupsCache=r.pickups||[];renderPickups(pickupsCache)}catch(e){$('pickupList').innerHTML='<div class="error">'+esc(e.message)+'</div>'}}
async function submitPickup(payload){const msg=$('pkMsg');msg.className='';msg.textContent='';try{const r=await apiPost(Object.assign({action:'registerPickup',userId,displayName},payload));if(!r.success)throw Error(r.error||'儲存失敗');$('pkName').value='';$('pkTrack').value='';$('pkCountry').value='';msg.className='ok';msg.textContent='已儲存';loadPickups()}catch(e){msg.className='error';msg.textContent=e.message}}
$('pickupBtn').onclick=loadPickups;
$('pkSubmit').onclick=()=>{const country=$('pkCountry').value.trim(),name=$('pkName').value.trim(),track=$('pkTrack').value.trim();if(!country){$('pkMsg').className='error';$('pkMsg').textContent='請填寫出貨國家';$('pkCountry').focus();return}if(!name&&!track){$('pkMsg').className='error';$('pkMsg').textContent='請至少填寫商品名稱或托運單號末四碼其中一項';return}if(track&&!/^[0-9A-Za-z]{4}$/.test(track)){$('pkMsg').className='error';$('pkMsg').textContent='托運單號請填末四碼';return}submitPickup({country,name,trackingLast4:track})};

async function loadOrders(){if(!userId){alert('尚未取得 LINE 使用者資料，請從 LINE 重新開啟此頁面。');return}$('orders').innerHTML='<div class="loading">讀取中…</div>';openSheet('ordersSheet');try{const r=await apiGet({action:'myOrders',userId});if(!r.success)throw Error(r.error||'讀取訂單失敗');ordersCache=r.orders||[];renderOrders(ordersCache)}catch(e){$('orders').innerHTML='<div class="error">'+esc(e.message)+'</div>'}}
async function cancelOrder(id){if(!confirm('確定要取消這筆訂單嗎？如果已進入處理流程可能無法取消。'))return;try{const r=await apiPost({action:'cancelOrder',userId,orderId:id});if(!r.success)throw Error(r.error||'取消失敗');alert('訂單已取消');loadOrders();loadShop(false)}catch(e){alert(e.message)}}
function editOrder(id,list){editingOrder=list.find(x=>x.orderId===id);if(!editingOrder)return;const box=$('editFields');box.innerHTML='';fields.forEach((f,i)=>{const w=document.createElement('div');w.className='field';const l=document.createElement('label');l.textContent=f.label||'';w.appendChild(l);const inp=document.createElement('input');inp.id='edit'+i;w.appendChild(inp);box.appendChild(w)});$('editMsg').textContent='';closeAll();openSheet('editSheet')}
$('saveEdit').onclick=async()=>{if(!editingOrder)return;const v={};fields.forEach((f,i)=>{const el=$('edit'+i);if(el&&el.value.trim())v[f.label]=el.value.trim()});try{const r=await apiPost({action:'updateOrder',userId,orderId:editingOrder.orderId,values:v});if(!r.success)throw Error(r.error||'修改失敗');$('editMsg').className='ok';$('editMsg').textContent='已儲存修改';setTimeout(loadOrders,600)}catch(e){$('editMsg').className='error';$('editMsg').textContent=e.message}};

$('cartbtn').onclick=()=>{renderCart();openSheet('cartSheet')};
$('checkoutBtn').onclick=()=>{if(!Object.keys(cart).length){alert('購物車是空的');return}renderSummary($('checkoutSummary'));renderFields();openSheet('checkoutSheet')};
$('ordersBtn').onclick=loadOrders;
$('successOrders').onclick=loadOrders;
$('form').onsubmit=async e=>{e.preventDefault();const msg=$('formMsg');msg.className='';const c=collectValues();if(!c.ok){msg.className='error';msg.textContent='請填寫所有必填欄位';return}if(!userId){msg.className='error';msg.textContent='尚未取得 LINE 使用者資料，請從 LINE 重新開啟此頁面。';return}const clientOrderKey=userId+'-'+Date.now()+'-'+Math.random().toString(36).slice(2);const payload={action:'createOrder',userId,displayName,clientOrderKey,agreeRules:true,values:c.v,cart:Object.values(cart).map(i=>({productId:i.productId,name:i.name,option:i.option,qty:i.qty}))};const btn=$('submit');btn.disabled=true;btn.textContent='正在確認庫存並送出…';try{const r=await apiPost(payload);if(!r.success)throw Error(r.error||'建立訂單失敗');localStorage.removeItem(CART_KEY);cart={};updateCart();closeAll();const s=r.summary||{};$('successContent').innerHTML='<p><b>訂單編號：'+esc(r.orderId||'')+'</b></p><div class="summary">商品合計：'+money(s.subtotal)+'<br>運費：待計算<br>待補款：'+money(s.pending)+'<br><b>目前應付：'+money(s.total)+'</b></div><p class="small">訂單已保存，你可以到「我的訂單」查看狀態。</p>';openSheet('successSheet')}catch(err){msg.className='error';msg.textContent='送出失敗：'+err.message}finally{btn.disabled=false;btn.textContent='確認送出訂單'}};

function bindContact(){
const btn=$('contactBtn2');
if(!btn)return;
if(contactUrl){btn.classList.remove('hidden');btn.onclick=()=>{if(typeof liff!=='undefined'&&liff.isLoggedIn&&liff.isLoggedIn()){liff.openWindow({url:contactUrl,external:false})}else{window.open(contactUrl,'_blank')|| (location.href=contactUrl)}}}
else{btn.classList.add('hidden')}
}

async function loadShop(first=true){
try{
const data=await apiGet({});
if(!data||!data.success)throw Error(data?.error||'網站資料讀取失敗');
products=(data.items||[]).map(normalizeProduct);fields=Array.isArray(data.fields)?data.fields:[];paymentInfo=Array.isArray(data.paymentInfo)?data.paymentInfo:[];contactUrl=data.contactUrl||'';
bindContact();renderCategories();renderProducts();updateCart();
if(first){$('loading').classList.add('hidden');$('shop').classList.remove('hidden')}
return true
}catch(e){if(first)showError(e.message||'網站載入失敗');throw e}
}

async function init(){
loadCart();updateCart();
// 商品頁不再等待 LIFF 登入完成才顯示，避免 LIFF 初始化或登入狀態造成「一直載入」。
try{await loadShop(true)}catch(e){return}
try{
await withTimeout(liff.init({liffId:LIFF_ID}),12000,'LINE 初始化');
if(liff.isLoggedIn&&liff.isLoggedIn()){
const p=await withTimeout(liff.getProfile(),10000,'LINE 使用者資料讀取');userId=p.userId;displayName=p.displayName||'';
}else{
console.warn('LIFF 尚未登入；商品瀏覽仍可使用，訂單/代收功能需要從 LINE 登入後使用。');
}
}catch(e){console.warn('LIFF 初始化失敗：',e);}
}
init();
</script>
